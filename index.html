<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f24">
<title>Things I've noticed about you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #0a0e22;
    --sky-bottom: #1b1842;
    --ink: #f5eedc;
    --dim: #a3a8cc;
    --gold: #f4dc9e;
    --panel: rgba(18, 22, 52, 0.88);
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background:
      radial-gradient(120% 70% at 50% 115%, rgba(140, 90, 150, 0.28), transparent 60%),
      linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #bg { pointer-events: none; }

  #world { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  #world.drag { cursor: grabbing; }
  #fg { pointer-events: none; }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    padding: calc(env(safe-area-inset-top, 0px) + 1.4rem) 1.5rem 0;
    pointer-events: none;
  }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1.6rem, 5.5vw, 2.4rem);
    line-height: 1.15;
    letter-spacing: -0.01em;
  }
  .count { margin: 0.45rem 0 0; font-size: 0.9rem; color: var(--dim); }

  .star {
    position: absolute; left: 0; top: 0;
    width: 44px; height: 44px; margin: -22px 0 0 -22px;
    padding: 0; border: 0; border-radius: 50%;
    background: transparent; cursor: pointer;
  }
  .star:focus-visible { outline: 2px solid var(--gold); outline-offset: -8px; }
  .star::after {
    content: attr(data-label);
    position: absolute; left: 50%; bottom: 100%;
    transform: translate(-50%, 4px);
    padding: 0.25rem 0.6rem; border-radius: 6px;
    background: var(--panel); color: var(--ink);
    font: 400 0.8rem/1.3 var(--sans); white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .star:hover::after, .star:focus-visible::after, .star.sel::after { opacity: 1; }

  #card {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
    margin: 0 auto; max-width: 520px;
    padding: 1.4rem 1.5rem calc(env(safe-area-inset-bottom, 0px) + 1.2rem);
    background: var(--panel);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 18px 18px 0 0;
    border-top: 1px solid rgba(244, 220, 158, 0.18);
    transform: translateY(105%); visibility: hidden;
    transition: transform 0.35s ease, visibility 0s linear 0.35s;
  }
  #card.open { transform: none; visibility: visible; transition: transform 0.35s ease; }
  #card .date { margin: 0 0 0.6rem; font-size: 0.85rem; color: var(--dim); }
  #card .text {
    margin: 0; font-family: var(--serif); font-size: 1.3rem; line-height: 1.5;
    max-width: 44ch;
  }
  #card .close {
    position: absolute; top: 0.6rem; right: 0.7rem;
    width: 44px; height: 44px; border: 0; border-radius: 50%;
    background: transparent; color: var(--dim);
    font-size: 1.6rem; line-height: 1; cursor: pointer;
  }
  #card .close:hover { color: var(--ink); }
  #card .close:focus-visible, .chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .rel { margin-top: 1rem; font-size: 0.85rem; color: var(--dim); }
  .rel span { margin-right: 0.4rem; }
  .chip {
    display: inline-block; margin: 0.25rem 0.4rem 0 0; padding: 0.3rem 0.75rem;
    border: 1px solid rgba(245, 238, 220, 0.25); border-radius: 999px;
    background: transparent; color: var(--ink);
    font: 400 0.85rem var(--sans); cursor: pointer;
  }
  .chip:hover { border-color: var(--gold); }

  header { transition: opacity 1.2s ease 0.4s; }
  body.has-cover header { opacity: 0; }

  #restart, #collapseBtn {
    min-height: 44px; margin: 0.3rem 0 0 -0.6rem; padding: 0 0.6rem;
    border: 0; border-radius: 999px; background: none; color: var(--dim);
    font: 400 0.85rem var(--sans); cursor: pointer; pointer-events: auto;
  }
  #restart:hover, #collapseBtn:hover { color: var(--ink); }
  #restart:focus-visible, #collapseBtn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  #collapseBtn { margin-left: 0.4rem; }

  #cover {
    position: fixed; inset: 0; z-index: 6;
    transition: opacity 0.9s ease, visibility 0s linear 0.9s;
  }
  #cover.gone { opacity: 0; visibility: hidden; pointer-events: none; }
  #cover .scroll {
    position: absolute; inset: 0; overflow-y: auto; text-align: center;
    padding: 58vh 1.5rem 55vh;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 74%, transparent 90%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 74%, transparent 90%);
    scrollbar-width: none; overscroll-behavior: contain;
  }
  #cover .scroll::-webkit-scrollbar { display: none; }
  #cover .inner { max-width: 34rem; margin: 0 auto; animation: coverIn 1.6s ease both; }
  @keyframes coverIn { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #cover .inner { animation: none; } }
  #cover .kicker {
    margin: 0 0 1rem; font-size: 0.8rem; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--gold);
  }
  #cover h2 {
    margin: 0 0 2.2rem; font-family: var(--serif); font-style: italic; font-weight: 400;
    font-size: clamp(2.1rem, 8vw, 3.2rem); line-height: 1.12; letter-spacing: -0.01em;
  }
  #cover p.body {
    margin: 0 0 1.9rem; font-family: var(--serif); font-size: 1.25rem; line-height: 1.7;
    color: rgba(245, 238, 220, 0.9);
  }
  #cover .next {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 1.6rem);
    min-height: 48px; padding: 0 1.8rem;
    border: 1px solid var(--gold); border-radius: 999px;
    background: rgba(13, 17, 40, 0.75); color: var(--ink);
    font: 500 0.95rem var(--sans); letter-spacing: 0.04em; cursor: pointer;
    transition: background 0.2s;
  }
  #cover .next:hover { background: rgba(244, 220, 158, 0.16); }
  #cover .next:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  #music {
    position: fixed; z-index: 8;
    top: calc(env(safe-area-inset-top, 0px) + 1.1rem); right: 1.1rem;
    display: inline-flex; align-items: center; gap: 0.5rem;
    min-height: 44px; padding: 0 1rem 0 0.85rem;
    border: 1px solid rgba(245, 238, 220, 0.25); border-radius: 999px;
    background: var(--panel); color: var(--dim);
    font: 400 0.85rem var(--sans); cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
  }
  #music:hover, #music.on { color: var(--ink); border-color: var(--gold); }
  #music:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  #music .w { display: none; }
  #music.on .w { display: inline; }
  #music.on .x { display: none; }

  #empty {
    position: fixed; inset: 0; display: none; place-items: center; text-align: center;
    padding: 2rem; color: var(--dim); font-family: var(--serif); font-size: 1.2rem;
  }
</style>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>

  <header>
    <h1 id="title">Things I've noticed about you</h1>
    <p class="count" id="count"></p>
    <button id="restart" type="button" hidden>&larr; Back to start</button>
    <button id="collapseBtn" type="button" hidden>Collapse group</button>
  </header>

  <button id="music" type="button" aria-pressed="false" aria-label="Play music">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9v6h4l5 4V5L8 9H4z"/>
      <path class="w" d="M16.5 8.5a5 5 0 0 1 0 7"/>
      <path class="w" d="M19 6a8.5 8.5 0 0 1 0 12"/>
      <path class="x" d="M16 9l5 6M21 9l-5 6"/>
    </svg>
    <span>Music</span>
  </button>

  <main id="world" aria-label="Constellation of memories">
    <canvas id="fg" aria-hidden="true"></canvas>
  </main>

  <p id="empty">No stars yet. Add your first memory in memories.js.</p>

  <section id="card" aria-live="polite" aria-label="Memory">
    <button class="close" id="close" aria-label="Close">&times;</button>
    <p class="date" id="cardDate"></p>
    <p class="text" id="cardText"></p>
    <div id="cardRel"></div>
  </section>

<script>
  // Always fetch the latest memories.js so new stars show up right away
  document.write('<script src="memories.js?t=' + Date.now() + '"><\/script>');
</script>
<script>
(function () {
  var data = window.MEMORIES || { items: [] };
  var items = (data.items || []).slice();
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var PALETTE = ["#f4dc9e", "#f2b8c6", "#a9c9f2", "#b6e2cf", "#cdbaf2"];

  var titleEl = document.getElementById("title");
  if (data.title) { titleEl.textContent = data.title; document.title = data.title; }
  var countEl = document.getElementById("count");
  var world = document.getElementById("world");
  var fg = document.getElementById("fg"), fctx = fg.getContext("2d");
  var bg = document.getElementById("bg"), bctx = bg.getContext("2d");
  var card = document.getElementById("card");

  if (!items.length) {
    document.getElementById("empty").style.display = "grid";
    countEl.textContent = "";
    return;
  }

  /* ---------- optional cover page (from "intro" in memories.js) ---------- */
  var began = true, t0 = null, pendingShoot = false, shoot = [], ambientAt = 0;
  var restartBtn = document.getElementById("restart");
  var collapseBtn = document.getElementById("collapseBtn");
  // on phones, each group of stars folds into its first star; tap to open it
  var collapseMode = false, openRoot = null, Z = 1, Zt = 1;
  var SPREAD = 1.5, EXPAND_ZOOM = 1.8;

  function showCover() {
    var intro = data.intro;
    var oldCover = document.getElementById("cover");
    if (oldCover && oldCover.parentNode) oldCover.parentNode.removeChild(oldCover);
    began = false;
    restartBtn.hidden = true;

    var cover = document.createElement("section");
    cover.id = "cover"; cover.setAttribute("aria-label", "Introduction");
    var scroller = document.createElement("div"); scroller.className = "scroll";
    var inner = document.createElement("div"); inner.className = "inner";
    var addEl = function (tag, cls, text) {
      var e = document.createElement(tag); if (cls) e.className = cls; e.textContent = text; inner.appendChild(e); return e;
    };
    if (intro.kicker) addEl("p", "kicker", intro.kicker);
    addEl("h2", "", intro.heading || data.title || "");
    (intro.paragraphs || []).forEach(function (t) { addEl("p", "body", t); });
    scroller.appendChild(inner); cover.appendChild(scroller);

    var next = document.createElement("button");
    next.type = "button"; next.className = "next"; next.textContent = intro.button || "Next";
    cover.appendChild(next);
    document.body.appendChild(cover);
    document.body.classList.add("has-cover");
    world.setAttribute("inert", "");

    // slow upward scroll, like end credits; any touch / wheel / key hands control back to her
    var auto = !reduce && intro.autoscroll !== false, last = null, pos = 0, speed = intro.speed || 30;
    ["wheel", "touchstart", "pointerdown", "keydown"].forEach(function (ev) {
      scroller.addEventListener(ev, function () { auto = false; }, { passive: true });
    });
    var tick = function (ts) {
      if (!auto) return;
      if (last === null) last = ts;
      var dt = Math.min((ts - last) / 1000, 0.1); last = ts;
      pos += dt * speed; scroller.scrollTop = pos;
      if (pos >= scroller.scrollHeight - scroller.clientHeight) { auto = false; return; }
      requestAnimationFrame(tick);
    };
    setTimeout(function () {
      if (!auto) return;
      if (intro.duration) {
        var range = scroller.scrollHeight - scroller.clientHeight;
        speed = Math.max(22, Math.min(45, range / intro.duration));
      }
      requestAnimationFrame(tick);
    }, 1800);

    next.addEventListener("click", function () {
      auto = false;
      cover.classList.add("gone");
      document.body.classList.remove("has-cover");
      world.removeAttribute("inert");
      restartBtn.hidden = false;
      began = true; t0 = null; pendingShoot = true;
      setTimeout(function () { if (cover.parentNode) cover.parentNode.removeChild(cover); }, 1200);
    });
    next.focus();
  }

  if (data.intro) {
    showCover();
    restartBtn.addEventListener("click", function () {
      select(null);
      hovered = null;
      pan.x = pan.y = target.x = target.y = 0;
      resetGroups();
      showCover();
    });
  }

  /* ---------- helpers ---------- */
  function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function rgb(hex) { var n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function parseDate(s) { var p = String(s || "").split("-"); return p.length === 3 ? new Date(+p[0], +p[1] - 1, +p[2]) : null; }
  function fmtDate(d) { return d ? d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }) : ""; }
  function shortLabel(it) { return it.label || (it.text.length > 30 ? it.text.slice(0, 28) + "…" : it.text); }

  /* ---------- layout in "world" units (stable: depends only on list order + ids) ---------- */
  var byId = {};
  items.forEach(function (it, i) { it.idx = i; it.kids = 0; byId[it.id] = it; });

  var placed = [], roots = 0;
  items.forEach(function (it) {
    var r = rng(hash(it.id));
    var parent = it.from && byId[it.from] && byId[it.from].pos ? byId[it.from] : null;
    var pos = null;
    if (parent) {
      it.parent = parent; parent.kids++;
      it.color = parent.color;
      for (var k = 0; k < 60; k++) {
        var a = r() * Math.PI * 2, d = 0.17 + r() * 0.12 + k * 0.004;
        var p = { x: parent.pos.x + Math.cos(a) * d, y: parent.pos.y + Math.sin(a) * d };
        var ok = placed.every(function (q) { return Math.hypot(p.x - q.pos.x, p.y - q.pos.y) > 0.11; });
        if (ok) { pos = p; break; }
        if (!pos) pos = p;
      }
    } else {
      var n = roots++;
      var ang = n * 2.399963 + r() * 0.35;
      var rad = 0.42 * Math.sqrt(n);
      pos = { x: Math.cos(ang) * rad, y: Math.sin(ang) * rad * 0.85 };
      it.color = PALETTE[n % PALETTE.length];
    }
    it.pos = pos; it.rgb = rgb(it.color);
    placed.push(it);
  });

  // a group = one starting star plus everything that grew from it
  items.forEach(function (it) { it.root = it.parent ? it.parent.root : it; it.members = it.members || 0; });
  items.forEach(function (it) { if (it.root !== it) it.root.members++; });
  items.forEach(function (it) { if (it.root === it) { it.e = 1; it.eT = 1; } });

  var rootList = items.filter(function (it) { return it.root === it; });

  function resetGroups() {
    openRoot = null; Z = Zt = 1;
    items.forEach(function (it) { if (it.root === it) { it.e = it.eT = collapseMode ? 0 : 1; } });
    collapseBtn.hidden = true;
  }
  function vis(it) { return collapseMode && it.root !== it ? it.root.e : 1; }
  // while a group is open, the other groups sink into the background
  function shade(it) { return vis(it) * (collapseMode && it.root !== openRoot ? 1 - 0.78 * Om : 1); }

  var now = new Date();
  items.forEach(function (it) {
    var d = parseDate(it.date); it.d = d;
    it.fresh = d && (now - d) / 864e5 <= 7 && (now - d) >= -864e5;
    it.phase = (hash(it.id) % 628) / 100;
  });
  items.forEach(function (it) { if (it.fresh) it.root.freshMember = true; });

  var latest = items[items.length - 1];
  countEl.textContent = (data.subtitle || "{n} things I've noticed so far").replace("{n}", items.length);

  /* ---------- star buttons (accessible, focusable hit targets) ---------- */
  var selected = null, hovered = null;
  items.forEach(function (it) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "star";
    b.setAttribute("data-label", shortLabel(it));
    b.setAttribute("aria-label", shortLabel(it));
    b.addEventListener("click", function (e) {
      e.stopPropagation();
      if (collapseMode && it.root === it && it.members) {
        if (openRoot === it) { if (selected === it) collapseGroup(); else select(it.id); }
        else { expandGroup(it); select(it.id, true); }
        return;
      }
      select(it.id);
    });
    b.addEventListener("pointerenter", function () { hovered = it; });
    b.addEventListener("pointerleave", function () { if (hovered === it) hovered = null; });
    b.addEventListener("focus", function () { hovered = it; });
    b.addEventListener("blur", function () { if (hovered === it) hovered = null; });
    world.appendChild(b); it.btn = b;
  });

  /* ---------- screen mapping ---------- */
  var W, H, dpr, S, cx, cy, midY, SY = 1, Om = 0;
  var pan = { x: 0, y: 0 }, target = { x: 0, y: 0 };
  var bgStars = [];

  function spreadRoots(dmin) {
    for (var iter = 0; iter < 160; iter++) {
      var moved = false;
      for (var i = 0; i < rootList.length; i++) {
        for (var j = i + 1; j < rootList.length; j++) {
          var a = rootList[i], b = rootList[j];
          var dx = b.rx - a.rx, dy = b.ry - a.ry, d = Math.hypot(dx, dy);
          if (d >= dmin) continue;
          if (d < 1e-6) { dx = 0.001 * (j - i); dy = 0.001; d = Math.hypot(dx, dy); }
          var push = (dmin - d) / 2 * 0.6, ux = dx / d, uy = dy / d;
          a.rx -= ux * push; a.ry -= uy * push; b.rx += ux * push; b.ry += uy * push; moved = true;
        }
      }
      if (!moved) break;
    }
  }

  function layout() {
    W = window.innerWidth; H = window.innerHeight; dpr = Math.min(window.devicePixelRatio || 1, 2);
    [fg, bg].forEach(function (c) { c.width = W * dpr; c.height = H * dpr; });
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0); bctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var want = data.collapse === true || (data.collapse !== false && W <= 720);
    if (want !== collapseMode) { collapseMode = want; resetGroups(); pan.x = pan.y = target.x = target.y = 0; }

    var padX = collapseMode ? Math.min(34, W * 0.1) : Math.min(90, W * 0.14), top = 130, bottom = 120;
    var availW = W - 2 * padX, availH = H - top - bottom;
    var minx, maxx, miny, maxy;
    function bounds(list, fx, fy) {
      minx = 1e9; maxx = -1e9; miny = 1e9; maxy = -1e9;
      list.forEach(function (it) {
        var x = fx(it), y = fy(it);
        minx = Math.min(minx, x); maxx = Math.max(maxx, x);
        miny = Math.min(miny, y); maxy = Math.max(maxy, y);
      });
    }
    var px = function (it) { return it.pos.x; }, py = function (it) { return it.pos.y; };
    var gx = function (it) { return it.rx; }, gy = function (it) { return it.ry; };
    if (collapseMode) {
      // folded groups on a tall phone screen: stretch the sky downward, then nudge
      // overlapping groups apart so every one is easy to tap
      bounds(rootList, px, py);
      SY = Math.max(1, Math.min(2.6, (availH / availW) * (Math.max(maxx - minx, 0.001) / Math.max(maxy - miny, 0.001))));
      rootList.forEach(function (it) { it.rx = it.pos.x; it.ry = it.pos.y * SY; });
      for (var pass = 0; pass < 3; pass++) {
        bounds(rootList, gx, gy);
        var s0 = Math.max(Math.min(availW / Math.max(maxx - minx, 0.001), availH / Math.max(maxy - miny, 0.001), 300), 30);
        spreadRoots(46 / s0);
      }
      bounds(rootList, gx, gy);
    } else {
      SY = 1;
      bounds(items, px, py);
    }
    var bw = Math.max(maxx - minx, 0.001), bh = Math.max(maxy - miny, 0.001);
    S = Math.max(Math.min(availW / bw, availH / bh, 300), collapseMode ? 30 : 110);
    cx = (minx + maxx) / 2; cy = (miny + maxy) / 2; midY = top + availH / 2;

    bgStars = [];
    var r = rng(7), n = Math.round(W * H / 7000);
    for (var i = 0; i < n; i++) bgStars.push({ x: r() * W, y: r() * H, s: r() * 1.1 + 0.3, p: r() * 6.28, a: r() * 0.5 + 0.15 });
  }

  // where a star sits in the world: group members fan out from their first star when it opens
  function dispPos(it) {
    var r = it.root;
    if (!collapseMode) return it.pos;
    if (r === it) return { x: r.rx, y: r.ry };
    var k = r.e * SPREAD;
    return { x: r.rx + (it.pos.x - r.pos.x) * k, y: r.ry + (it.pos.y - r.pos.y) * k };
  }

  function project() {
    items.forEach(function (it) {
      var dp = dispPos(it);
      var sx = W / 2 + (dp.x - cx) * S * Z + pan.x;
      var sy = midY + (dp.y - cy) * S * Z + pan.y;
      if (sx !== it.sx || sy !== it.sy) {
        it.sx = sx; it.sy = sy;
        it.btn.style.transform = "translate(" + sx.toFixed(1) + "px," + sy.toFixed(1) + "px)";
      }
      var hide = vis(it) < 0.05;
      if (hide !== it.hid) { it.hid = hide; it.btn.style.display = hide ? "none" : ""; }
    });
  }

  function groupCentre(root) {
    var x = root.rx, y = root.ry, n = 1;
    items.forEach(function (o) {
      if (o.root === root && o !== root) {
        x += root.rx + (o.pos.x - root.pos.x) * SPREAD;
        y += root.ry + (o.pos.y - root.pos.y) * SPREAD; n++;
      }
    });
    return { x: x / n, y: y / n };
  }
  function expandGroup(root) {
    if (openRoot && openRoot !== root) openRoot.eT = 0;
    openRoot = root; root.eT = 1; Zt = EXPAND_ZOOM;
    var c = groupCentre(root);
    target.x = -(c.x - cx) * S * Zt;
    target.y = H * 0.36 - midY - (c.y - cy) * S * Zt;
    collapseBtn.hidden = false;
  }
  function collapseGroup() {
    if (!openRoot) return;
    openRoot.eT = 0;
    if (selected && selected.root === openRoot) select(null);
    openRoot = null; Zt = 1; target.x = target.y = 0;
    collapseBtn.hidden = true;
  }
  collapseBtn.addEventListener("click", collapseGroup);

  /* ---------- drawing ---------- */
  var step;
  function reveal(it, el) {
    if (!began) return 0;
    if (reduce) return 1;
    var v = (el - 1000 - it.idx * step) / 700;
    return v < 0 ? 0 : v > 1 ? 1 : v;
  }
  function rgba(c, a) { return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; }

  // one streak; dir -1 flies toward the lower left, +1 toward the lower right
  function shootOne(t, delay, scale, dir, bright) {
    var base = Math.max(W, 700);
    var ang = (24 + Math.random() * 12) * Math.PI / 180;
    shoot.push({
      x: dir < 0 ? W * (0.45 + Math.random() * 0.5) : W * (0.05 + Math.random() * 0.5),
      y: H * (0.04 + Math.random() * 0.2),
      dx: dir * Math.cos(ang), dy: Math.sin(ang),
      v: base * 0.95 * scale, len: 150 * scale, w: 2.2 * scale, s: scale, b: bright,
      born: t + delay, life: 1.15 / scale * 0.9
    });
  }

  // the pair that opens the sky
  function launchShooting(t) {
    shootOne(t, 0, 1, -1, 1);
    shootOne(t, 520, 0.6, -1, 1);
  }

  // the occasional one that drifts by while she explores
  function ambientShooting(t) {
    var scale = 0.7 + Math.random() * 0.4, dir = Math.random() < 0.5 ? -1 : 1;
    shootOne(t, 0, scale, dir, 0.8);
    if (Math.random() < 0.25) shootOne(t, 450, scale * 0.6, dir, 0.6);
  }

  function drawShooting(t) {
    fctx.lineCap = "round";
    for (var i = shoot.length - 1; i >= 0; i--) {
      var m = shoot[i], e = (t - m.born) / 1000;
      if (e < 0) continue;
      if (e > m.life) { shoot.splice(i, 1); continue; }
      var p = e / m.life;
      var a = Math.min(p / 0.12, 1) * (1 - p) * m.b;
      var hx = m.x + m.dx * m.v * e, hy = m.y + m.dy * m.v * e;
      var tx = hx - m.dx * m.len, ty = hy - m.dy * m.len;
      var g = fctx.createLinearGradient(tx, ty, hx, hy);
      g.addColorStop(0, "rgba(255,250,235,0)");
      g.addColorStop(1, "rgba(255,250,235," + a.toFixed(3) + ")");
      fctx.strokeStyle = g; fctx.lineWidth = m.w;
      fctx.beginPath(); fctx.moveTo(tx, ty); fctx.lineTo(hx, hy); fctx.stroke();
      var r = 12 * m.s;
      var hg = fctx.createRadialGradient(hx, hy, 0, hx, hy, r);
      hg.addColorStop(0, "rgba(255,250,235," + (0.9 * a).toFixed(3) + ")");
      hg.addColorStop(1, "rgba(255,250,235,0)");
      fctx.fillStyle = hg;
      fctx.beginPath(); fctx.arc(hx, hy, r, 0, 6.2832); fctx.fill();
    }
    fctx.lineCap = "butt";
  }

  function frame(t) {
    var el = -1e9;
    if (began) { if (t0 === null) t0 = t; el = t - t0; }
    if (pendingShoot && began) { pendingShoot = false; if (!reduce) launchShooting(t); }
    if (!began) ambientAt = 0;
    else if (!reduce) {
      if (ambientAt === 0) ambientAt = t + 6500 + Math.random() * 4000;
      else if (t >= ambientAt && !shoot.length) { ambientShooting(t); ambientAt = t + 7000 + Math.random() * 9000; }
    }
    step = Math.min(260, 2400 / items.length);

    if (collapseMode) items.forEach(function (it) {
      if (it.root === it && it.members) {
        it.e += (it.eT - it.e) * 0.14;
        if (Math.abs(it.eT - it.e) < 0.005) it.e = it.eT;
      }
    });
    Z += (Zt - Z) * 0.12; if (Math.abs(Zt - Z) < 0.002) Z = Zt;
    Om += ((collapseMode && openRoot ? 1 : 0) - Om) * 0.12; if (Om < 0.003) Om = 0;
    pan.x += (target.x - pan.x) * 0.15; pan.y += (target.y - pan.y) * 0.15;
    if (Math.abs(target.x - pan.x) < 0.05) pan.x = target.x;
    if (Math.abs(target.y - pan.y) < 0.05) pan.y = target.y;
    project();

    // background dust
    bctx.clearRect(0, 0, W, H);
    for (var i = 0; i < bgStars.length; i++) {
      var s = bgStars[i], tw = reduce ? 1 : 0.65 + 0.35 * Math.sin(t / 1400 + s.p);
      bctx.fillStyle = "rgba(235,235,255," + (s.a * tw).toFixed(3) + ")";
      bctx.fillRect(s.x, s.y, s.s, s.s);
    }

    // constellation
    fctx.clearRect(0, 0, W, H);
    fctx.lineWidth = 1;
    items.forEach(function (it) {
      var a = reveal(it, el) * shade(it);
      if (a <= 0.01) return;
      if (it.parent) {
        fctx.setLineDash([]);
        fctx.strokeStyle = rgba(it.rgb, 0.32 * a);
        fctx.beginPath(); fctx.moveTo(it.parent.sx, it.parent.sy); fctx.lineTo(it.sx, it.sy); fctx.stroke();
      }
      (it.links || []).forEach(function (id) {
        var o = byId[id]; if (!o || !o.pos) return;
        var b = Math.min(a, reveal(o, el) * shade(o)); if (b <= 0.01) return;
        fctx.setLineDash([3, 5]);
        fctx.strokeStyle = rgba(it.rgb, 0.2 * b);
        fctx.beginPath(); fctx.moveTo(o.sx, o.sy); fctx.lineTo(it.sx, it.sy); fctx.stroke();
      });
    });
    fctx.setLineDash([]);

    items.forEach(function (it) {
      var a = reveal(it, el) * shade(it);
      if (a <= 0.01) return;
      var on = it === selected, hot = it === hovered;
      var folded = collapseMode && it.root === it && it.members ? 1 - it.e : 0;
      var r = 2.4 + Math.min(it.kids, 4) * 0.55;
      var tw = reduce ? 1 : 1 + 0.12 * Math.sin(t / 900 + it.phase);
      var boost = (on ? 1.5 : hot ? 1.25 : 1) * tw;
      var gr = r * 7 * boost;
      if (collapseMode) gr = Math.min(gr, 26);

      var g = fctx.createRadialGradient(it.sx, it.sy, 0, it.sx, it.sy, gr);
      g.addColorStop(0, rgba(it.rgb, 0.55 * a));
      g.addColorStop(1, rgba(it.rgb, 0));
      fctx.fillStyle = g;
      fctx.beginPath(); fctx.arc(it.sx, it.sy, gr, 0, 6.2832); fctx.fill();

      if (it.kids >= 2) {
        fctx.strokeStyle = rgba(it.rgb, 0.5 * a);
        var L = r * 3.4;
        fctx.beginPath();
        fctx.moveTo(it.sx - L, it.sy); fctx.lineTo(it.sx + L, it.sy);
        fctx.moveTo(it.sx, it.sy - L); fctx.lineTo(it.sx, it.sy + L);
        fctx.stroke();
      }

      fctx.fillStyle = "rgba(255,250,235," + (0.95 * a).toFixed(3) + ")";
      fctx.beginPath(); fctx.arc(it.sx, it.sy, r * (on ? 1.3 : 1), 0, 6.2832); fctx.fill();

      if (on) {
        fctx.strokeStyle = rgba(it.rgb, 0.8);
        fctx.beginPath(); fctx.arc(it.sx, it.sy, r + 7, 0, 6.2832); fctx.stroke();
      }
      if (folded > 0.02) {
        fctx.strokeStyle = rgba(it.rgb, 0.55 * folded * a);
        fctx.beginPath(); fctx.arc(it.sx, it.sy, r + 9, 0, 6.2832); fctx.stroke();
        fctx.fillStyle = "rgba(245,238,220," + (0.85 * folded * a).toFixed(3) + ")";
        fctx.font = "10px Figtree, system-ui, sans-serif"; fctx.textAlign = "center";
        fctx.fillText("+" + it.members, it.sx, it.sy + r + 22);
      }
      var isFresh = it.fresh || (folded > 0.02 && it.freshMember);
      if (isFresh && !reduce) {
        var ph = (t / 1800 + it.phase) % 1;
        fctx.strokeStyle = rgba(it.rgb, 0.6 * (1 - ph) * a);
        fctx.beginPath(); fctx.arc(it.sx, it.sy, r + 4 + ph * 16, 0, 6.2832); fctx.stroke();
      } else if (isFresh) {
        fctx.strokeStyle = rgba(it.rgb, 0.5);
        fctx.beginPath(); fctx.arc(it.sx, it.sy, r + 8, 0, 6.2832); fctx.stroke();
      }
    });

    if (shoot.length) drawShooting(t);

    requestAnimationFrame(frame);
  }

  /* ---------- detail card ---------- */
  var cardDate = document.getElementById("cardDate"),
      cardText = document.getElementById("cardText"),
      cardRel = document.getElementById("cardRel");

  function relRow(label, list) {
    if (!list.length) return;
    var row = document.createElement("div"); row.className = "rel";
    var s = document.createElement("span"); s.textContent = label; row.appendChild(s);
    list.forEach(function (o) {
      var c = document.createElement("button");
      c.type = "button"; c.className = "chip"; c.textContent = shortLabel(o);
      c.addEventListener("click", function () { select(o.id); });
      row.appendChild(c);
    });
    cardRel.appendChild(row);
  }

  function select(id, skipPan) {
    var it = id ? byId[id] : null;
    if (it && collapseMode && it.root.members && openRoot !== it.root) { expandGroup(it.root); skipPan = true; }
    selected = it;
    items.forEach(function (o) { o.btn.classList.toggle("sel", o === it); });
    if (!it) { card.classList.remove("open"); return; }

    cardDate.textContent = it.d ? "Noticed on " + fmtDate(it.d) : "";
    cardText.textContent = it.text;
    cardRel.innerHTML = "";
    var kids = items.filter(function (o) { return o.parent === it; });
    var linked = [];
    (it.links || []).forEach(function (l) { if (byId[l]) linked.push(byId[l]); });
    items.forEach(function (o) { if ((o.links || []).indexOf(it.id) > -1 && linked.indexOf(o) < 0) linked.push(o); });
    relRow("Grew from", it.parent ? [it.parent] : []);
    relRow("Led to", kids);
    relRow("Also connected to", linked);
    card.classList.add("open");

    // keep the chosen star visible above the card
    if (skipPan) return;
    var cardH = card.offsetHeight, limit = H - cardH - 70;
    if (it.sy > limit) target.y = pan.y - (it.sy - limit);
    else if (it.sy < 110) target.y = pan.y + (110 - it.sy);
    var maxX = W - 40; if (it.sx > maxX) target.x = pan.x - (it.sx - maxX);
    if (it.sx < 40) target.x = pan.x + (40 - it.sx);
  }

  document.getElementById("close").addEventListener("click", function () { select(null); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") select(null); });

  /* ---------- drag to explore ---------- */
  var drag = null;
  world.addEventListener("pointerdown", function (e) {
    if (e.target.closest(".star")) return;
    drag = { x: e.clientX, y: e.clientY, px: pan.x, py: pan.y, moved: false };
    world.setPointerCapture(e.pointerId); world.classList.add("drag");
  });
  world.addEventListener("pointermove", function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.hypot(dx, dy) > 4) drag.moved = true;
    pan.x = target.x = drag.px + dx; pan.y = target.y = drag.py + dy;
  });
  function endDrag() {
    if (drag && !drag.moved) select(null);
    drag = null; world.classList.remove("drag");
  }
  world.addEventListener("pointerup", endDrag);
  world.addEventListener("pointercancel", endDrag);

  window.addEventListener("resize", function () { layout(); items.forEach(function (it) { it.sx = null; }); });

  layout();
  requestAnimationFrame(frame);
})();
</script>
<script>
(function () {
  var btn = document.getElementById("music");
  var audio = new Audio("song.mp3");
  audio.loop = true; audio.preload = "metadata"; audio.volume = 0;
  var LEVEL = 0.5, timer;

  function fade(to, done) {
    clearInterval(timer);
    timer = setInterval(function () {
      var d = to - audio.volume;
      if (Math.abs(d) < 0.03) { audio.volume = to; clearInterval(timer); if (done) done(); }
      else audio.volume = Math.max(0, Math.min(1, audio.volume + (d > 0 ? 0.03 : -0.03)));
    }, 60);
  }
  function setOn(on) {
    btn.classList.toggle("on", on);
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.setAttribute("aria-label", on ? "Pause music" : "Play music");
  }

  btn.addEventListener("click", function () {
    if (audio.paused) {
      var p = audio.play();
      setOn(true); fade(LEVEL);
      if (p && p.catch) p.catch(function () {
        clearInterval(timer); setOn(false);
        var label = btn.querySelector("span"), prev = label.textContent;
        label.textContent = audio.error ? "Song not found" : "Tap again";
        setTimeout(function () { label.textContent = prev; }, 2500);
      });
    } else {
      setOn(false); fade(0, function () { audio.pause(); });
    }
  });
})();
</script>
</body>
</html>
